name: Publish package update

run-name: Publication moved (${{ inputs.package }})

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package whose publication moved to tvr-works/homebrew-tap
        required: true
        type: string
      version:
        description: Previously requested source version
        required: true
        type: string

permissions: {}

jobs:
  moved:
    name: Explain moved publication
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Reject obsolete publication before any download or proposal
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            frame | key | xkcdpass)
              echo "$PACKAGE publication has moved to tvr-works/homebrew-tap. Dispatch publish-package.yml there." >&2
              ;;
            *) echo "Unsupported package: $PACKAGE" >&2 ;;
          esac
          exit 1
