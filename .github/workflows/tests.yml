name: Homebrew checks

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Audit changed packages
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Set up Homebrew and check out the tap
        id: homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          core: false
          cask: false
          stable: true

      - name: Install Homebrew style dependencies
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        run: brew install-bundler-gems --groups=style

      - name: Check tap syntax
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        run: |
          set -euo pipefail
          brew test-bot --only-tap-syntax

      - name: Audit tap packages
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        run: |
          if [[ -n "$(git ls-files 'Casks/*.rb' 'Formula/*.rb')" ]]; then
            brew audit --strict --online --tap=tvanreenen/tap
          else
            echo "Compatibility tap has no packages; forwarding and retired publishers are checked by the migration contract."
          fi

  migration:
    name: Test tap migration contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
